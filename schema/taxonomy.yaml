# Single source of truth for the controlled vocabularies referenced by
# schema/skill.schema.json and enforced by scripts/validate.js.
#
# Adding a skill that needs a new category, stage, or io type means adding
# it here first. This is what keeps the dependency graph computable: two
# skills only chain if they reference the exact same io_types id.

categories:
  - id: behaviour-definition
    label: Behaviour Definition
    description: Turning a program goal or vague intent into a defined, measurable target.
  - id: diagnosis
    label: Diagnosis
    description: Explaining why a defined behaviour isn't happening (barriers, drivers, root causes).
  - id: intervention-design
    label: Intervention Design
    description: Turning a diagnosis into candidate levers, messages, or intervention content.
  - id: measurement
    label: Measurement
    description: Choosing, adapting, or building instruments to measure a behaviour or construct.
  - id: research-methods
    label: Research Methods
    description: Analytical or methodological operations (e.g. effect size adjustment, model specification).
  - id: segmentation
    label: Segmentation & Personas
    description: Grouping people or contexts into behaviourally meaningful segments.
  - id: risk-review
    label: Risk & Pre-Mortem
    description: Anticipating backfire effects, failure points, or unintended consequences before launch.
  - id: cultural-context
    label: Cultural Context
    description: Assessing how a cultural or contextual lens changes what will work.
  - id: evidence-scoping
    label: Evidence Scoping
    description: Surveying existing evidence for a behaviour or context before diagnosis or design begins.
  - id: researcher-calibration
    label: Researcher Calibration
    description: >-
      Checking the research team's own priors, assumptions, or evidence gaps
      before they shape downstream diagnosis or design. Distinct from
      Cultural Context, which is about the target population rather than
      the researcher.
  - id: context-mapping
    label: Context Mapping
    description: >-
      Characterizing the specific population, setting, and touchpoints a
      behaviour actually occurs in, before that context is assumed from a
      funder's abstract label rather than checked.
  - id: research-transparency
    label: Research Transparency
    description: >-
      Documenting and disclosing how a piece of work was actually produced —
      including where AI tools were involved — so readers can hold the
      human authors accountable for it. Distinct from Researcher
      Calibration, which checks the team's priors before the work; this
      discloses the process after it.

# A research stage is orthogonal to category: it's where in a project
# timeline a skill is normally invoked, independent of what it does.
stages:
  - id: prepare
    label: Prepare
    description: >-
      Groundwork before defining a target behaviour: gathering evidence and
      checking the research team's own priors.
  - id: define
    label: Define
    description: Establishing what behaviour, population, or outcome the work is about.
  - id: diagnose
    label: Diagnose
    description: Understanding why the current behaviour pattern exists.
  - id: design
    label: Design
    description: Generating intervention content or strategy.
  - id: test
    label: Test
    description: Planning or analyzing an evaluation of an intervention.
  - id: measure
    label: Measure
    description: Instrumenting or validating measurement itself.
  - id: report
    label: Report
    description: >-
      Writing up and disclosing what was done and found, after the
      substantive work — declarations, documentation, and communication of
      the process itself.

# io_types are the controlled vocabulary for declared inputs/outputs.
# `user_suppliable: true` marks a type a human is expected to provide
# directly (a document, a raw goal statement, field notes). Any input type
# that is NOT user_suppliable must be produced as an output by at least one
# skill in the repo, or validation fails — that's the rule that keeps the
# graph honest instead of full of dangling edges.
io_types:
  - id: program_goal_statement
    label: Program goal statement
    description: >-
      A practitioner's plain-language description of what a program is trying
      to achieve, plus whatever context they have on the target population and
      setting. Typically vague and not yet a measurable behaviour.
    user_suppliable: true

  - id: target_behaviour_brief
    label: Target behaviour brief
    description: >-
      One measurable, observable target behaviour specified as who + what +
      when, plus a prioritized list of runner-up candidate behaviours with the
      reasoning for why the top choice won.
    user_suppliable: false

  - id: comb_barrier_hypotheses
    label: COM-B barrier hypotheses
    description: >-
      Competing Capability / Opportunity / Motivation barrier hypotheses for
      one target behaviour, each with the diagnostic question(s) that would
      discriminate it from the others.
    user_suppliable: false

  - id: evidence_scan_brief
    label: Evidence scan brief
    description: >-
      A structured summary of existing evidence for a target behaviour,
      population, or context: what's already been tried, effect sizes where
      available, contradicting or null findings, and which specific
      findings are WEIRD-skewed.
    user_suppliable: false

  - id: researcher_assumption_statement
    label: Researcher assumption statement
    description: >-
      A researcher's own short, honest answers to a fixed set of self-report
      prompts about their prior beliefs on why the target population
      behaves as it does, given before looking at any diagnostic data: what
      they already believe is causing the behaviour gap, what population
      they've personally worked with most and how similar it is to this
      one, and what observation would change their mind.
    user_suppliable: true

  - id: bias_audit_report
    label: Bias audit report
    description: >-
      A structured flag list surfacing which parts of a researcher's stated
      prior assumptions are unfalsifiable as written, default to a WEIRD
      population as the implicit norm, or lack a named disconfirming
      observation. Not a pass/fail score, and not a debiasing plan — only a
      surfacing of what's already there.
    user_suppliable: false

  - id: audience_context_brief
    label: Audience & context brief
    description: >-
      The target population operationalized as a specific, observable
      subgroup; the decision moment where the behaviour choice actually
      gets made; the channels already reaching this population today; and
      which of the input's assumptions default to WEIRD infrastructure
      without having been confirmed locally.
    user_suppliable: false

  - id: evaluation_design_brief
    label: Evaluation design brief
    description: >-
      A pre-registration-style plan for measuring one target behaviour:
      primary outcome metric, comparison condition, minimum effect worth
      detecting, data-source feasibility, and any mediating measures needed
      to evaluate a specific barrier hypothesis, locked in before data
      collection starts.
    user_suppliable: false

  - id: intervention_lever_brief
    label: Intervention lever brief
    description: >-
      Candidate intervention functions for one confirmed COM-B barrier,
      derived from the Behaviour Change Wheel's published function-to-
      component linkage matrix rather than free-generated, each scored for
      feasibility and — for the top candidate — broken down into concrete
      behaviour change techniques.
    user_suppliable: false

  - id: affirmation_context_statement
    label: Affirmation context statement
    description: >-
      A plain-language description of the target population and the
      specific evaluative or stigmatized domain a values-affirmation
      exercise needs to buffer against (e.g. financial shame, academic
      underperformance, a health stigma), plus whatever is known about
      which values are actually meaningful to this population.
    user_suppliable: true

  - id: values_affirmation_script
    label: Values-affirmation script
    description: >-
      A drafted values-affirmation writing exercise following the
      standard self-affirmation protocol — a locally adapted value
      category list, a selection prompt, and a structured writing prompt —
      plus delivery notes (timing, frequency ceiling) and an explicit
      caution against using it as a substitute for structural fixes.
    user_suppliable: false

  - id: prior_intervention_record
    label: Prior intervention record
    description: >-
      A team's own raw, unstructured account of an intervention they
      already tried: what was planned, what they believe happened, and why
      they believe it succeeded or failed — given before checking that
      belief against whatever data was actually collected.
    user_suppliable: true

  - id: intervention_content_draft
    label: Intervention content draft
    description: >-
      Delivery-ready draft content — message text, script lines, signage,
      or interface copy — instantiating one named behaviour change
      technique, with a fidelity trace mapping each content element to the
      technique's defined active ingredient, delivery notes (channel,
      timing, sender, frequency ceiling), and the comprehension pre-test
      the draft must pass before launch.
    user_suppliable: false

  - id: ai_use_account
    label: AI use account
    description: >-
      A team's own raw, honest account of how a piece of work was actually
      produced: who worked on which parts, which AI tools were used where,
      roughly how much each tool contributed, and anything the team is
      unsure whether to disclose — given in plain language before any
      structuring.
    user_suppliable: true

  - id: sifa_declaration
    label: SIFA declaration
    description: >-
      A structured Statement of Intellectual Fellowship and Accountability:
      for each applicable CRediT contributor role, who performed the work,
      which AI tool was involved (if any), the extent of AI involvement on
      SIFA's none/some/extensive scale, and a brief audit note explaining
      the rating — with responsibility explicitly retained by the human
      authors.
    user_suppliable: false

  - id: intervention_post_mortem_brief
    label: Intervention post-mortem brief
    description: >-
      A structured retrospective distinguishing what was planned from what
      was actually implemented, classifying the outcome as an implementation
      failure or an idea failure, and checking the team's causal story
      against what data was actually collected — not a recommendation of
      what to do next.
    user_suppliable: false
